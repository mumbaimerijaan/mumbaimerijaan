<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <!-- Pastel Background Gradient -->
    <linearGradient id="auroraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="35%" stop-color="#ede9fe" />
      <stop offset="70%" stop-color="#fce7f3" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>

    <!-- Translucent Glass Surface -->
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.88" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85" />
    </linearGradient>

    <!-- Purple Gradient Text -->
    <linearGradient id="purpleGradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.08" />
    </filter>

    <!-- Ambient Glow Blobs -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>

    <!-- Laptop Screen Gradient -->
    <linearGradient id="laptopScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Robot Gradient -->
    <linearGradient id="robotWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
    .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; }
  </style>

  <!-- Outer Glass Canvas with Ambient Gradient -->
  <rect x="8" y="8" width="904" height="324" rx="24" fill="url(#auroraBg)" />
  
  <!-- Ambient Glow Accents -->
  <circle cx="200" cy="80" r="140" fill="#c7d2fe" opacity="0.5" filter="url(#softGlow)" />
  <circle cx="780" cy="120" r="130" fill="#fbcfe8" opacity="0.45" filter="url(#softGlow)" />
  <circle cx="500" cy="260" r="120" fill="#a7f3d0" opacity="0.4" filter="url(#softGlow)" />

  <!-- Main Card Surface with 1px delicate border -->
  <rect x="8" y="8" width="904" height="324" rx="24" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9" />

  <!-- LEFT SECTION: Content (Sachin) -->
  <g transform="translate(48, 44)">

    <!-- Status Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="26" rx="13" fill="#ffffff" fill-opacity="0.95" stroke="#e0e7ff" stroke-width="1.5" />
      <circle cx="14" cy="13" r="4.5" fill="#10b981" />
      <text x="26" y="17" fill="#4338ca" class="pill-text" font-size="11">Open to Collaboration</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 56)">
      <text x="0" y="0" fill="#1e1b4b" class="title-text" font-size="34">Hi, I'm <tspan fill="url(#purpleGradText)">Sachin</tspan> 👋</text>
    </g>

    <!-- Headline / Role -->
    <g transform="translate(0, 88)">
      <text x="0" y="0" fill="#334155" class="subtitle-text" font-size="18">Frontend Developer &amp; AI Builder</text>
    </g>

    <!-- Intro Narrative -->
    <g transform="translate(0, 116)">
      <text x="0" y="0" fill="#475569" class="body-text" font-size="13">I build web apps, tools and creative projects with React, JavaScript and AI.</text>
      <text x="0" y="20" fill="#64748b" class="body-text" font-size="12">Exploring AI tools and vibe coding to turn ideas into production-ready software.</text>
    </g>

    <!-- Technology Pills -->
    <g transform="translate(0, 168)">
      <!-- Pill 1: React -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="76" height="28" rx="8" fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="1" />
        <circle cx="14" cy="14" r="5" fill="#38bdf8" />
        <text x="25" y="18" fill="#1e293b" class="pill-text">React</text>
      </g>
      <!-- Pill 2: TypeScript -->
      <g transform="translate(84, 0)">
        <rect x="0" y="0" width="98" height="28" rx="8" fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="1" />
        <rect x="8" y="7" width="14" height="14" rx="3" fill="#3178c6" />
        <text x="12" y="18" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">TS</text>
        <text x="27" y="18" fill="#1e293b" class="pill-text">TypeScript</text>
      </g>
      <!-- Pill 3: Node.js -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="84" height="28" rx="8" fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="1" />
        <circle cx="14" cy="14" r="5" fill="#22c55e" />
        <text x="25" y="18" fill="#1e293b" class="pill-text">Node.js</text>
      </g>
      <!-- Pill 4: MERN -->
      <g transform="translate(282, 0)">
        <rect x="0" y="0" width="74" height="28" rx="8" fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="1" />
        <circle cx="14" cy="14" r="5" fill="#10b981" />
        <text x="25" y="18" fill="#1e293b" class="pill-text">MERN</text>
      </g>
      <!-- Pill 5: AI Tools -->
      <g transform="translate(364, 0)">
        <rect x="0" y="0" width="88" height="28" rx="8" fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="1" />
        <text x="10" y="18" font-size="12">✨</text>
        <text x="26" y="18" fill="#1e293b" class="pill-text">AI Tools</text>
      </g>
      <!-- Pill 6: Open Source -->
      <g transform="translate(460, 0)">
        <rect x="0" y="0" width="108" height="28" rx="8" fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="1" />
        <text x="10" y="18" font-size="12">🐙</text>
        <text x="27" y="18" fill="#1e293b" class="pill-text">Open Source</text>
      </g>
    </g>

    <!-- Social Chips Row -->
    <g transform="translate(0, 214)">
      <text x="0" y="12" fill="#64748b" class="pill-text" font-size="11">CONNECT:</text>
      <!-- GitHub Link -->
      <g transform="translate(70, -4)">
        <rect x="0" y="0" width="88" height="24" rx="6" fill="#1e1b4b" />
        <text x="10" y="16" fill="#ffffff" class="pill-text" font-size="10">GitHub</text>
        <text x="54" y="16" fill="#a5b4fc" class="pill-text" font-size="10">↗</text>
      </g>
      <!-- LinkedIn Link -->
      <g transform="translate(166, -4)">
        <rect x="0" y="0" width="94" height="24" rx="6" fill="#0284c7" />
        <text x="10" y="16" fill="#ffffff" class="pill-text" font-size="10">LinkedIn</text>
        <text x="60" y="16" fill="#bae6fd" class="pill-text" font-size="10">↗</text>
      </g>
      <!-- Location Chip -->
      <g transform="translate(268, -4)">
        <rect x="0" y="0" width="112" height="24" rx="6" fill="#ffffff" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="1" />
        <text x="8" y="16" fill="#64748b" class="pill-text" font-size="10">📍 Mumbai, India</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SECTION: Workspace Illustration (Desk, Laptop, AI Robot, Plant) -->
  <g transform="translate(580, 20) scale(0.92)">
    
    <!-- City Backdrop Silhouette -->
    <path d="M40 240 L40 200 L65 200 L65 175 L95 175 L95 240 L125 240 L125 160 L155 160 L155 185 L180 185 L180 240 L260 240 L260 180 L290 180 L290 150 L325 150 L325 195 L355 195 L355 240 Z" fill="#c7d2fe" opacity="0.35" />

    <!-- Desk Surface -->
    <rect x="15" y="240" width="370" height="12" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <ellipse cx="200" cy="256" rx="160" ry="10" fill="#94a3b8" opacity="0.18" />

    <!-- Potted Plant on Left -->
    <path d="M45 240 L54 205 L84 205 L93 240 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <ellipse cx="69" cy="205" rx="15" ry="3" fill="#94a3b8" />
    <path d="M69 205 Q58 160 38 165 Q53 185 69 205 Z" fill="#34d399" />
    <path d="M69 205 Q74 150 84 155 Q79 180 69 205 Z" fill="#10b981" />
    <path d="M69 205 Q89 170 104 175 Q84 190 69 205 Z" fill="#059669" />

    <!-- Cute AI Robot Assistant -->
    <g transform="translate(100, 160)">
      <!-- Shadow -->
      <ellipse cx="40" cy="80" rx="26" ry="6" fill="#64748b" opacity="0.25" />
      <!-- Body -->
      <rect x="20" y="44" width="40" height="32" rx="14" fill="url(#robotWhite)" stroke="#c7d2fe" stroke-width="2" />
      <!-- Chest Light -->
      <circle cx="40" cy="60" r="5" fill="#38bdf8" />
      <circle cx="40" cy="60" r="2.5" fill="#ffffff" />
      <!-- Arms -->
      <rect x="12" y="48" width="7" height="18" rx="3.5" fill="#e2e8f0" />
      <rect x="61" y="48" width="7" height="18" rx="3.5" fill="#e2e8f0" />
      <!-- Head -->
      <rect x="14" y="10" width="52" height="34" rx="16" fill="url(#robotWhite)" stroke="#c7d2fe" stroke-width="2" />
      <!-- Screen Face -->
      <rect x="20" y="15" width="40" height="24" rx="10" fill="#0f172a" />
      <!-- Cyan Eyes -->
      <ellipse cx="32" cy="27" rx="4" ry="5" fill="#38bdf8" />
      <ellipse cx="48" cy="27" rx="4" ry="5" fill="#38bdf8" />
      <circle cx="33" cy="25" r="1.5" fill="#ffffff" />
      <circle cx="49" cy="25" r="1.5" fill="#ffffff" />
      <!-- Antenna -->
      <line x1="40" y1="10" x2="40" y2="2" stroke="#94a3b8" stroke-width="2" />
      <circle cx="40" cy="2" r="3" fill="#818cf8" />
    </g>

    <!-- Laptop with Glowing Code Editor -->
    <g transform="translate(185, 110)">
      <!-- Laptop Base -->
      <rect x="10" y="128" width="160" height="7" rx="3" fill="#94a3b8" />
      <polygon points="25,128 155,128 175,133 5,133" fill="#cbd5e1" />
      <!-- Laptop Screen -->
      <rect x="20" y="16" width="140" height="112" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
      <rect x="26" y="22" width="128" height="100" rx="5" fill="url(#laptopScreen)" />
      <!-- Code </> -->
      <text x="90" y="78" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">&lt;/&gt;</text>
      <!-- Syntax lines -->
      <line x1="38" y1="34" x2="65" y2="34" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />
      <line x1="72" y1="34" x2="110" y2="34" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" />
      <line x1="38" y1="96" x2="85" y2="96" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
      <line x1="92" y1="96" x2="125" y2="96" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Books & Coffee Cup on Right -->
    <g transform="translate(340, 180)">
      <!-- Book 1 -->
      <rect x="5" y="44" width="45" height="10" rx="2" fill="#818cf8" />
      <!-- Book 2 -->
      <rect x="10" y="33" width="40" height="10" rx="2" fill="#38bdf8" />
      <!-- Coffee Mug -->
      <rect x="20" y="12" width="20" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <path d="M40 16 C44 16 45 19 45 22 C45 25 44 27 40 27" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
      <path d="M26 8 Q23 4 28 0" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
      <path d="M33 9 Q37 5 32 1" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    </g>
  </g>
</svg>
