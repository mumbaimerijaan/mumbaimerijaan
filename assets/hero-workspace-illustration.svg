<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ede9fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fce7f3" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="laptopScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="robotBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f8fafc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.6" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Soft Ambient Glows -->
  <circle cx="360" cy="120" r="100" fill="#c7d2fe" opacity="0.4" filter="url(#softGlow)" />
  <circle cx="140" cy="180" r="80" fill="#fbcfe8" opacity="0.3" filter="url(#softGlow)" />

  <!-- City Skyline Silhouette Backdrop -->
  <path d="M40 220 L40 180 L60 180 L60 160 L85 160 L85 220 L110 220 L110 150 L140 150 L140 170 L160 170 L160 220 L280 220 L280 165 L310 165 L310 140 L340 140 L340 180 L370 180 L370 220 Z" fill="#e0e7ff" opacity="0.4" />

  <!-- Desk Surface -->
  <rect x="20" y="220" width="440" height="12" rx="6" fill="url(#deskGrad)" />
  <ellipse cx="240" cy="236" rx="200" ry="12" fill="#cbd5e1" opacity="0.3" />

  <!-- Potted Plant on Left -->
  <path d="M55 220 L65 185 L95 185 L105 220 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="3" />
  <ellipse cx="80" cy="185" rx="15" ry="3" fill="#94a3b8" />
  <!-- Leaves -->
  <path d="M80 185 Q70 140 50 145 Q65 165 80 185 Z" fill="#34d399" />
  <path d="M80 185 Q85 130 95 135 Q90 160 80 185 Z" fill="#10b981" />
  <path d="M80 185 Q100 150 115 155 Q95 170 80 185 Z" fill="#059669" />

  <!-- Cute AI Robot Assistant -->
  <g transform="translate(140, 145)">
    <!-- Shadow -->
    <ellipse cx="40" cy="74" rx="28" ry="6" fill="#cbd5e1" opacity="0.5" />
    <!-- Body -->
    <rect x="20" y="42" width="40" height="30" rx="12" fill="url(#robotBodyGrad)" stroke="#c7d2fe" stroke-width="2" />
    <!-- Chest Core Light -->
    <circle cx="40" cy="57" r="5" fill="#38bdf8" />
    <circle cx="40" cy="57" r="2.5" fill="#ffffff" />
    <!-- Arms -->
    <rect x="12" y="46" width="7" height="18" rx="3.5" fill="#e2e8f0" />
    <rect x="61" y="46" width="7" height="18" rx="3.5" fill="#e2e8f0" />
    <!-- Head -->
    <rect x="14" y="10" width="52" height="34" rx="16" fill="url(#robotBodyGrad)" stroke="#c7d2fe" stroke-width="2" />
    <!-- Screen Face -->
    <rect x="20" y="15" width="40" height="24" rx="10" fill="#0f172a" />
    <!-- Glowing Cyan Eyes -->
    <ellipse cx="32" cy="27" rx="4" ry="5" fill="#38bdf8" />
    <ellipse cx="48" cy="27" rx="4" ry="5" fill="#38bdf8" />
    <circle cx="33" cy="25" r="1.5" fill="#ffffff" />
    <circle cx="49" cy="25" r="1.5" fill="#ffffff" />
    <!-- Antenna -->
    <line x1="40" y1="10" x2="40" y2="2" stroke="#94a3b8" stroke-width="2" />
    <circle cx="40" cy="2" r="3" fill="#818cf8" />
  </g>

  <!-- Laptop with Code Glow -->
  <g transform="translate(235, 100)">
    <!-- Screen Base Hinge -->
    <rect x="10" y="118" width="160" height="7" rx="3" fill="#94a3b8" />
    <polygon points="25,118 155,118 175,123 5,123" fill="#cbd5e1" />
    <!-- Laptop Screen Case -->
    <rect x="20" y="12" width="140" height="106" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <!-- Display Screen -->
    <rect x="26" y="18" width="128" height="94" rx="5" fill="url(#laptopScreenGrad)" />
    <!-- Code Editor Content: </> -->
    <text x="90" y="72" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">&lt;/&gt;</text>
    <!-- Code lines decoration -->
    <line x1="38" y1="30" x2="60" y2="30" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />
    <line x1="66" y1="30" x2="105" y2="30" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" />
    <line x1="38" y1="88" x2="80" y2="88" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <line x1="86" y1="88" x2="120" y2="88" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Stack of Books & Coffee Cup on Right -->
  <g transform="translate(400, 165)">
    <!-- Book 1 (Bottom) -->
    <rect x="5" y="44" width="55" height="11" rx="2" fill="#818cf8" />
    <!-- Book 2 (Middle) -->
    <rect x="10" y="32" width="50" height="11" rx="2" fill="#38bdf8" />
    <!-- Book 3 (Top) -->
    <rect x="8" y="20" width="52" height="11" rx="2" fill="#f472b6" />
    <!-- Coffee Mug -->
    <rect x="24" y="0" width="22" height="19" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Mug Handle -->
    <path d="M46 4 C50 4 52 8 52 11 C52 14 50 16 46 16" fill="none" stroke="#cbd5e1" stroke-width="2" />
    <!-- Steam -->
    <path d="M30 -3 Q27 -8 32 -13" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M38 -2 Q42 -7 37 -12" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
