<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="100%" height="100%">
  <defs>
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="chainGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#818cf8" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background pastel aura -->
  <circle cx="95" cy="50" r="45" fill="#e0e7ff" opacity="0.6" />
  <circle cx="120" cy="35" r="30" fill="#c7d2fe" opacity="0.5" />
  
  <!-- Interlocking 3D Chain Links -->
  <g transform="translate(60, 15) rotate(25)" filter="url(#chainGlow)">
    <!-- First Link -->
    <rect x="10" y="15" width="45" height="24" rx="12" fill="none" stroke="url(#linkGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Second Link -->
    <rect x="35" y="15" width="45" height="24" rx="12" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  </g>
</svg>
