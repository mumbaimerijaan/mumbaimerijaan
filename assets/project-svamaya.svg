<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fce7f3" />
    </linearGradient>
    <filter id="tshirtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f472b6" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background pastel pink glow -->
  <circle cx="100" cy="50" r="45" fill="#fdf2f8" opacity="0.8" />
  <circle cx="120" cy="40" r="30" fill="#fbcfe8" opacity="0.5" />
  
  <!-- T-shirt Icon Artwork -->
  <g transform="translate(75, 20)" filter="url(#tshirtGlow)">
    <path d="M 12 8 L 22 18 C 28 14 36 14 42 18 L 52 8 L 62 20 L 52 26 L 52 56 L 12 56 L 12 26 L 2 20 Z" fill="url(#shirtGrad)" stroke="#f472b6" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Collar curve -->
    <path d="M 22 18 C 28 24 36 24 42 18" fill="none" stroke="#f472b6" stroke-width="2.5" />
  </g>
</svg>
